# PABLO AI SOCIAL AGENT — reverse proxy
# Routes the dashboard (Next.js) and the API (NestJS) behind a single origin.
# For HTTPS on a VPS, terminate TLS here with certbot/Let's Encrypt certificates
# (see docs/VPS_GUIDE.md) and redirect :80 to :443.

client_max_body_size 15m;

upstream pablo_web {
  server web:3000;
}

upstream pablo_api {
  server api:4000;
}

server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  location /api/ {
    proxy_pass http://pablo_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    alias /var/www/uploads/;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location / {
    proxy_pass http://pablo_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
